course:
  headline: Eine Runde durch das Hafenbecken
  lap_length_m: 1000
  paragraphs:
    - Der Kurs misst 1000 m und verläuft einmal durch das gesamte Hafenbecken — als Wendepunktstrecke mit 500 m Länge, zwei Bahnen ergeben eine Runde.
    - Anmeldung sowie Ein- und Ausstieg befinden sich vor dem Power Sports, Hafenweg 10, 48155 Münster.
    - Gezählt und gemessen wird elektronisch per Transponder. Das Tragen eines Neoprenanzuges ist freigestellt.
  image:
    src: /strecke/kurs.png
    # alt ist im Schema Pflicht: Eine Streckenkarte ohne Beschreibung ist für
    # jeden wertlos, der sie nicht sehen kann.
    alt: Luftbild des Münsteraner Stadthafens mit eingezeichnetem Kurs — eine Wendepunktstrecke von 500 m Länge entlang des Hafenbeckens, Start und Ziel am Hafenkai vor dem Power Sports.
    width: 2138
    height: 814

