name: Deploy to GitHub Pages

# Baut die Astro-Seite und veröffentlicht `dist/`.
#
# Vorher lud dieser Workflow das handgebaute Verzeichnis `site/` hoch, ohne je
# einen Build auszuführen. Nach dem Umstieg auf Astro gibt es `site/` nicht mehr
# — ohne diesen Schritt deployt der Workflow ein leeres Artefakt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` ist `astro check && astro build`: Ein Typfehler oder ein
      # ungültiges event.yaml bricht hier ab, statt live zu landen.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
