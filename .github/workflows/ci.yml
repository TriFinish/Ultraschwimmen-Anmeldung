name: CI

# Führt aus, was vorher nur lokal lief. Ohne diesen Workflow schützten die
# Tests nichts: Sie konnten grün sein oder rot, gemerkt hätte es niemand.

on:
  push:
    branches-ignore: [main] # auf main läuft ohnehin der Deploy mit `astro check`
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Baut (inkl. astro check) und prüft danach die Unit- und
      # Komponententests. Die Build-Integritätstests in tests/unit/dist.test.ts
      # brauchen dist/ — deshalb diese Reihenfolge, siehe Kommentar dort.
      - name: Build und Unit-Tests
        run: npm run verify

      # Nur Chromium: Beide Playwright-Projekte laufen darauf, siehe
      # playwright.config.ts. Ein zweiter Browser-Download wäre reine Wartezeit.
      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npx playwright test

      - name: Report sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
