faq:
  - q: Ist Neopren erlaubt?
    a: Freigestellt — du entscheidest.
  - q: Ab welchem Alter?
    a: TODO vor Livegang klären — das Anmeldeformular sagt 12, die Preisstaffel und die Ausschreibung sagen 10. Unter 18 zusätzlich mit schriftlicher Einverständniserklärung der Erziehungsberechtigten; die wird mit der Meldebestätigung zugesandt.
  - q: Können wir uns als Gruppe gemeinsam anmelden?
    a: Ja. Im Anmeldeformular fügst du mit „+" weitere Personen hinzu — jede mit eigener Distanz, bezahlt wird einmal zusammen. Adresse, Mail und Telefon gelten dann für die ganze Buchung.
  - q: Was brauche ich für die Anmeldung?
    a: Adresse, Mail und Telefonnummer für die Buchung, dazu pro Person Name, Geburtsdatum, Geschlecht und die gewünschte Distanz. Ein Notfallkontakt ist optional, aber sinnvoll.
  - q: Kann ich nachmelden?
    a: Ja, am Veranstaltungstag gegen 5 € Nachmeldegebühr.
  - q: Wie wird gewertet?
    a: Nach DTU-Altersklassen, mit elektronischer Zeitmessung per Transponder.

