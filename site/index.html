<!doctype html>
<html lang="de">
  <head>
    <!--
      Nicht entfernen: raceresult liefert `registration.js` ohne `charset` im
      Content-Type aus. Das eingebettete Formular erbt deshalb die Kodierung
      dieser Seite — ohne diese Zeile wird aus „Zurück" und „März" Buchstabensalat.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmeldung Ultraschwimmen 2026</title>
    <meta
      name="description"
      content="Distanzen, Preise und Anmeldefrist für das Ultraschwimmen im Stadthafen Münster — und der direkte Weg zur Anmeldung."
    />

    <meta property="og:title" content="Anmeldung Ultraschwimmen 2026" />
    <meta
      property="og:description"
      content="Distanzen, Preise und Anmeldefrist für das Ultraschwimmen im Stadthafen Münster — und der direkte Weg zur Anmeldung."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f2f9fd" />

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="stylesheet" href="assets/style.css" />

    <!--
      Umami Analytics (self-hosted auf Vercel).
      TODO vor Livegang: eigene Website-ID für anmeldung.ultraschwimmen.de
      anlegen und unten eintragen. Solange der Platzhalter steht, wird nichts
      gemessen — und der MVP misst genau eine Zahl, also fällt das auf.
      app.js warnt zusätzlich in der Konsole.
    -->
    <script
      defer
      src="https://umami-six-cyan.vercel.app/script.js"
      data-website-id="TODO-EIGENE-WEBSITE-ID"
    ></script>
  </head>
  <body>
    <div class="waves" aria-hidden="true">
      <svg
        class="waves-svg"
        viewBox="0 24 150 28"
        preserveAspectRatio="none"
        shape-rendering="auto"
      >
        <defs>
          <path
            id="wave-path"
            d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"
          />
        </defs>
        <g class="wave-parallax">
          <use href="#wave-path" x="48" y="0" />
          <use href="#wave-path" x="48" y="3" />
          <use href="#wave-path" x="48" y="5" />
          <use href="#wave-path" x="48" y="7" />
        </g>
      </svg>
    </div>

    <div class="page">
      <main class="content" id="app" aria-live="polite">
        <p class="loading">Lädt…</p>
      </main>
    </div>

    <!-- Sticky CTA, erst nach erfolgreichem Rendern sichtbar (siehe app.js). -->
    <div class="cta-bar" id="cta-bar" hidden>
      <div class="cta-inner">
        <a class="cta" id="cta" href="#">
          <span class="cta-label">Zur Anmeldung</span>
          <span class="cta-arrow" aria-hidden="true">→</span>
        </a>
        <p class="cta-hint" id="cta-hint"></p>
      </div>
    </div>

    <template id="header-template">
      <header class="header">
        <img class="logo" src="assets/logo.svg" alt="" />
        <h1 class="header-title"></h1>
        <p class="header-meta"></p>
      </header>
    </template>

    <template id="deadline-template">
      <section class="deadline" aria-live="polite">
        <p class="deadline-lead"></p>
        <p class="deadline-value"></p>
        <p class="deadline-sub"></p>
      </section>
    </template>

    <template id="distance-template">
      <label class="card">
        <input class="card-input" type="radio" name="distanz" />
        <span class="card-body">
          <span class="card-head">
            <span class="card-label"></span>
            <span class="card-price"></span>
          </span>
          <span class="card-meta">
            <span class="card-start"></span>
            <span class="card-laps"></span>
          </span>
          <span class="card-youth"></span>
        </span>
        <span class="card-check" aria-hidden="true">✓</span>
      </label>
    </template>

    <template id="faq-template">
      <details class="faq-item">
        <summary class="faq-q"></summary>
        <p class="faq-a"></p>
      </details>
    </template>

    <!-- ES-Module, kein Build-Schritt: der Browser löst die Importe selbst auf.
         `type="module"` bringt `defer` schon mit. -->
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
